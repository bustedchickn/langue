# Server-only template. start-turn.sh adds realm, public IP, and shared secret.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
min-port=49160
max-port=49359

fingerprint
use-auth-secret
stale-nonce=600
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
# Coturn 4.18 uses these boolean enable switches; keep TLS 1.2 as the minimum.
tlsv1=0
tlsv1_1=0

# WebRTC uses UDP relay allocations even when the client-to-TURN transport is
# TCP/TLS. This disables RFC 6062 peer TCP allocations, not TCP/TLS listeners.
no-tcp-relay
no-multicast-peers
cli=0
no-software-attribute

# Prevent use of this relay to reach private, loopback, or metadata services.
# Keep the relay's own PUBLIC address reachable for relay-to-relay voice.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Initial small-deployment limits. A browser can gather several allocations per
# player. Increase quotas AND the mapped/firewalled relay range when scaling.
user-quota=12
total-quota=150
max-bps=128000
bps-capacity=19200000

log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
